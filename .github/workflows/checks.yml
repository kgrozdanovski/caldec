name: Repository checks

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2.2,<3'
      - run: python scripts/check_data.py
      - run: python scripts/check_numbers.py
      - run: python scripts/check_evidence.py
      - run: python scripts/test_generate.py
      - run: python -m compileall -q scripts
